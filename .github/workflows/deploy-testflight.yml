name: Deploy to TestFlight

on:
  repository_dispatch:
    types: [deploy-testflight]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Opaque dispatch job ID (UUID)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-deploy-execution
  cancel-in-progress: false

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      runner: ${{ steps.resolve.outputs.runner }}

    steps:
      - name: Resolve runner from job metadata
        id: resolve
        env:
          PROXY_PAT: ${{ secrets.PROXY_PAT }}
          DISPATCH_STATE_REPO: ${{ secrets.DISPATCH_STATE_REPO }}
          WORKFLOW_JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -euo pipefail

          if [ -z "${DISPATCH_STATE_REPO:-}" ]; then
            echo "DISPATCH_STATE_REPO secret is required"
            exit 1
          fi

          if ! [[ "$DISPATCH_STATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "DISPATCH_STATE_REPO secret must be in owner/name form"
            exit 1
          fi

          matches_whole() {
            case "$1" in *$'\n'*|*$'\r'*) return 1 ;; esac
            printf '%s' "$1" | LC_ALL=C grep -Eq "$2"
          }

          job_id="$(jq -r '.client_payload.job_id // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$job_id" ]; then
            job_id="$WORKFLOW_JOB_ID"
          fi

          if ! matches_whole "$job_id" '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "Missing or invalid job_id in dispatch payload"
            exit 1
          fi

          if [ -z "${PROXY_PAT:-}" ]; then
            echo "PROXY_PAT secret is unset or empty — cannot resolve the requested runner"
            exit 1
          fi

          state_body_file="$RUNNER_TEMP/runner-state-response.json"
          trap 'rm -f "$state_body_file"' EXIT
          state_url="https://api.github.com/repos/${DISPATCH_STATE_REPO}/contents/${job_id}.json"
          curl_rc=0
          http_status="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS \
            -H "Authorization: token ${PROXY_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            -o "$state_body_file" \
            -w '%{http_code}' \
            "$state_url")" || curl_rc=$?

          if [ "$curl_rc" -ne 0 ] || [ "$http_status" != "200" ]; then
            echo "Unable to resolve runner requirements from dispatch state (HTTP ${http_status}, curl exit ${curl_rc})"
            exit 1
          fi

          encoded_content="$(jq -r '.content // empty' "$state_body_file" 2>/dev/null)" || {
            echo "Dispatch state response was malformed while resolving runner requirements"
            exit 1
          }
          state_json="$(printf '%s' "$encoded_content" | tr -d '\n' | base64 --decode 2>/dev/null)" || {
            echo "Dispatch state content was invalid while resolving runner requirements"
            exit 1
          }
          xcode_version="$(printf '%s' "$state_json" | jq -r '.xcode_version // empty' 2>/dev/null)" || {
            echo "Dispatch state metadata was malformed while resolving runner requirements"
            exit 1
          }

          if [ -n "$xcode_version" ] && ! matches_whole "$xcode_version" '^[0-9]+([.][0-9]+)?$'; then
            echo "Invalid xcode_version in dispatch state"
            exit 1
          fi

          case "$xcode_version" in
            "")
              runner="macos-latest"
              ;;
            27|27.*)
              runner="xcode-27"
              ;;
            *)
              echo "No hosted runner mapping is configured for requested Xcode ${xcode_version}"
              exit 1
              ;;
          esac

          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  deploy-testflight:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      SCHEME_NAME: ${{ secrets.SCHEME_NAME }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - name: Parse dispatch payload
        env:
          PROXY_PAT: ${{ secrets.PROXY_PAT }}
          DISPATCH_STATE_REPO: ${{ secrets.DISPATCH_STATE_REPO }}
          WORKFLOW_JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -euo pipefail

          # The state repository name is private configuration; keep it out of workflow source and logs.
          if [ -z "${DISPATCH_STATE_REPO:-}" ]; then
            echo "DISPATCH_STATE_REPO secret is required"
            exit 1
          fi

          if ! [[ "$DISPATCH_STATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "DISPATCH_STATE_REPO secret must be in owner/name form"
            exit 1
          fi

          # grep tests each line separately; reject multi-line values so a check covers the whole value.
          matches_whole() {
            case "$1" in *$'\n'*|*$'\r'*) return 1 ;; esac
            printf '%s' "$1" | LC_ALL=C grep -Eq "$2"
          }

          # Only the opaque job handle is read from the public dispatch payload.
          job_id="$(jq -r '.client_payload.job_id // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$job_id" ]; then
            job_id="$WORKFLOW_JOB_ID"
          fi

          if [ -z "$job_id" ]; then
            echo "Missing job_id in dispatch payload"
            exit 1
          fi

          if ! matches_whole "$job_id" '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "Invalid job_id format"
            exit 1
          fi

          state_url="https://api.github.com/repos/${DISPATCH_STATE_REPO}/contents/${job_id}.json"

          if [ -z "${PROXY_PAT:-}" ]; then
            echo "PROXY_PAT secret is unset or empty — cannot authenticate to the dispatch state repository"
            exit 1
          fi

          # The response body is private; keep it outside the workspace and never print it.
          state_body_file="$RUNNER_TEMP/state-response.json"
          trap 'rm -f "$state_body_file"' EXIT
          curl_rc=0
          http_status="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS \
            -H "Authorization: token ${PROXY_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            -o "$state_body_file" \
            -w '%{http_code}' \
            "$state_url")" || curl_rc=$?

          if [ "$http_status" = "000" ]; then
            echo "Dispatch state fetch did not complete (transport/DNS failure; HTTP 000) — check network and re-run."
            exit 1
          elif [ "$curl_rc" -ne 0 ]; then
            echo "Dispatch state fetch returned HTTP ${http_status} but transfer did not complete (curl exit ${curl_rc}) — response body may be truncated. This is not a confirmed token or permission failure; check network stability and re-run."
            exit 1
          elif [ "$http_status" = "401" ]; then
            echo "Dispatch state fetch returned HTTP 401 — PROXY_PAT secret is stale or revoked. Rotate the secret."
            exit 1
          elif [ "$http_status" = "403" ]; then
            # Distinguish rate-limit (transient) from permission denial (credential problem) without echoing the body.
            if [ -f "$state_body_file" ] && LC_ALL=C grep -qi "rate limit" "$state_body_file" 2>/dev/null; then
              echo "Dispatch state fetch returned HTTP 403 — GitHub rate limit exceeded. This is transient; re-run the workflow."
            else
              echo "Dispatch state fetch returned HTTP 403 — PROXY_PAT may lack contents:read on the dispatch state repository, but this status also occurs from WAF/proxy blocks, organization IP-allowlist enforcement, or SAML/SSO requirements. Check PAT scopes and org settings before rotating the secret."
            fi
            exit 1
          elif [ "$http_status" = "429" ]; then
            echo "Dispatch state fetch returned HTTP 429 — GitHub rate limit exceeded. This is transient; re-run the workflow."
            exit 1
          elif [ "$http_status" = "404" ]; then
            probe_rc=0
            probe_status="$(curl --max-time 10 -sS \
              -H "Authorization: token ${PROXY_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              -o /dev/null -w '%{http_code}' \
              "https://api.github.com/repos/${DISPATCH_STATE_REPO}/contents/")" || probe_rc=$?
            if [ "$probe_rc" -ne 0 ] && [ "$probe_status" != "000" ]; then
              echo "Dispatch state file not found (HTTP 404) for job ${job_id} — contents probe returned HTTP ${probe_status} but transfer did not complete (curl exit ${probe_rc}). Cause is ambiguous; check network stability and re-run."
            elif [ "$probe_status" = "200" ]; then
              echo "Dispatch state file not found (HTTP 404) for job ${job_id} — PROXY_PAT can read the repo contents; file was never written or was already consumed. Check that the dispatch workflow uploaded the state file before triggering this run."
            elif [ "$probe_status" = "000" ]; then
              echo "Dispatch state file not found (HTTP 404) for job ${job_id} — contents probe did not complete (transport/DNS failure; HTTP 000). Cause is ambiguous: file may be missing/consumed, or PROXY_PAT may lack access. Check PAT scopes and re-run."
            elif [ "$probe_status" = "429" ]; then
              echo "Dispatch state file not found (HTTP 404) for job ${job_id} — contents probe returned HTTP 429 (rate limit). Cause is ambiguous; re-run the workflow."
            elif [ "$(printf '%s' "$probe_status" | LC_ALL=C cut -c1)" = "5" ]; then
              echo "Dispatch state file not found (HTTP 404) for job ${job_id} — contents probe returned HTTP ${probe_status} (GitHub service failure). This is transient; re-run the workflow."
            elif [ "$probe_status" = "401" ]; then
              echo "Dispatch state fetch returned HTTP 404 for job ${job_id}, and contents probe returned HTTP 401 — PROXY_PAT is invalid or expired. Rotate PROXY_PAT."
            else
              echo "Dispatch state fetch returned HTTP 404 for job ${job_id}, and contents probe returned HTTP ${probe_status} — cause is not confirmed; PROXY_PAT may lack contents:read, or an org/SSO/IP policy may be blocking access. Check PAT scopes and org settings before rotating."
            fi
            exit 1
          elif [ "$(printf '%s' "$http_status" | LC_ALL=C cut -c1)" = "5" ]; then
            echo "Dispatch state fetch returned HTTP ${http_status} — GitHub service failure. This is transient; re-run the workflow."
            exit 1
          elif [ "$http_status" != "200" ]; then
            echo "Dispatch state fetch returned unexpected HTTP ${http_status} for job ${job_id}"
            exit 1
          fi

          state_response="$(cat "$state_body_file")" || {
            echo "Failed to read dispatch state response file for job ${job_id} — unexpected I/O error"
            exit 1
          }
          rm -f "$state_body_file"
          trap - EXIT

          file_sha="$(printf '%s' "$state_response" | jq -r '.sha // empty' 2>/dev/null)" || {
            echo "Failed to parse .sha from dispatch state response for job ${job_id} — body may be non-JSON or malformed"
            exit 1
          }
          encoded_content="$(printf '%s' "$state_response" | jq -r '.content // empty' 2>/dev/null)" || {
            echo "Failed to parse .content from dispatch state response for job ${job_id} — body may be non-JSON or malformed"
            exit 1
          }

          if [ -z "$file_sha" ] || [ -z "$encoded_content" ]; then
            echo "Dispatch state response missing .sha or .content fields for job ${job_id} — unexpected API response shape"
            exit 1
          fi

          if ! matches_whole "$file_sha" '^[0-9a-f]{40}([0-9a-f]{24})?$'; then
            echo "Dispatch state response has an invalid .sha for job ${job_id}"
            exit 1
          fi

          echo "::add-mask::$file_sha"

          state_json="$(printf '%s' "$encoded_content" | tr -d '\n' | /usr/bin/base64 -D 2>/dev/null)" || {
            echo "Failed to decode .content field for job ${job_id} — field was not valid base64. Response body may be malformed or proxy-modified."
            exit 1
          }

          if ! printf '%s' "$state_json" | jq -e 'type == "object"' >/dev/null 2>&1; then
            state_json_type="$(printf '%s' "$state_json" | jq -r 'type' 2>/dev/null || echo 'unknown')"
            echo "Decoded .content for job ${job_id} is not a JSON object (got type: ${state_json_type}) — dispatch state payload was malformed or proxy-modified. Check that the dispatch workflow wrote a valid state file."
            exit 1
          fi

          ref="$(printf '%s' "$state_json" | jq -r '.ref // empty')"
          sha="$(printf '%s' "$state_json" | jq -r '.sha // empty')"
          project_id="$(printf '%s' "$state_json" | jq -r '.project_id // empty')"
          xcode_version="$(printf '%s' "$state_json" | jq -r '.xcode_version // empty')"

          event_type="$(printf '%s' "$state_json" | jq -r '.event_type // empty')"
          if [ "$event_type" != "deploy-testflight" ]; then
            echo "State file event_type mismatch (expected deploy-testflight)"
            exit 1
          fi

          delete_payload="$(jq -n \
            --arg message "consumed dispatch state for job ${job_id}" \
            --arg file_sha "$file_sha" \
            '{message: $message, sha: $file_sha}')"

          delete_response="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS -w '\n%{http_code}' \
            -X DELETE \
            -H "Authorization: token ${PROXY_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "$state_url" \
            -d "$delete_payload")"

          delete_http_code="$(printf '%s' "$delete_response" | tail -1)"
          if [ "$delete_http_code" -lt 200 ] || [ "$delete_http_code" -ge 300 ]; then
            echo "Γ¥î Failed to delete dispatch state ΓÇö aborting to prevent replay"
            exit 1
          fi

          if [ -z "$ref" ] || [ -z "$sha" ]; then
            echo "Missing ref or sha in dispatch state"
            exit 1
          fi

          if ! matches_whole "$ref" '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid ref format"
            exit 1
          fi

          if ! matches_whole "$sha" '^[0-9a-f]{40}$'; then
            echo "Invalid sha format"
            exit 1
          fi

          if [ -n "$project_id" ] && ! matches_whole "$project_id" '^[0-9]+$'; then
            echo "Invalid project_id format"
            exit 1
          fi

          if [ -n "$xcode_version" ] && ! matches_whole "$xcode_version" '^[0-9]+([.][0-9]+)?$'; then
            echo "Invalid xcode_version format"
            exit 1
          fi

          if [ -n "$ref" ]; then echo "::add-mask::$ref"; fi
          if [ -n "$sha" ]; then echo "::add-mask::$sha"; fi
          if [ -n "$project_id" ]; then echo "::add-mask::$project_id"; fi

          {
            echo "REF<<__REF_EOF__"
            printf '%s' "$ref"
            echo
            echo "__REF_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "SHA<<__SHA_EOF__"
            printf '%s' "$sha"
            echo
            echo "__SHA_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "PROJECT_ID<<__PROJECT_ID_EOF__"
            printf '%s' "$project_id"
            echo
            echo "__PROJECT_ID_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "XCODE_VERSION<<__XCODE_VERSION_EOF__"
            printf '%s' "$xcode_version"
            echo
            echo "__XCODE_VERSION_EOF__"
          } >> "$GITHUB_ENV"

      - name: Checkout CI configuration
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/sanitize-patterns.json
          sparse-checkout-cone-mode: false

      - name: Clone source repository
        env:
          SOURCE_REPOSITORY_URL: ${{ secrets.SOURCE_REPOSITORY_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SOURCE_REPOSITORY_URL" ]; then
            echo "SOURCE_REPOSITORY_URL secret is required"
            exit 1
          fi

          echo "::add-mask::$SOURCE_REPOSITORY_URL"

          git clone --depth 1 --branch "$REF" "$SOURCE_REPOSITORY_URL" source 2>/dev/null || {
            git clone "$SOURCE_REPOSITORY_URL" source 2>/dev/null
            cd source
            git checkout --detach "$SHA" > /dev/null 2>&1
          }

      - name: Summarize SCM callback target
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ID:-}" ] || [ -z "${SHA:-}" ] || [ -z "${REF:-}" ]; then
            echo "SCM callback target incomplete; project_id_present=$([ -n "${PROJECT_ID:-}" ] && echo yes || echo no) sha_present=$([ -n "${SHA:-}" ] && echo yes || echo no) ref_present=$([ -n "${REF:-}" ] && echo yes || echo no)"
            exit 0
          fi

          echo "::add-mask::${PROJECT_ID}"
          echo "::add-mask::${SHA:0:12}"
          echo "::add-mask::${REF}"
          echo "SCM callback target ready"

      - name: Report pending status
        env:
          SCM_API_BASE_URL: ${{ secrets.SCM_API_BASE_URL }}
          SCM_API_TOKEN: ${{ secrets.SCM_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PROJECT_ID" ] || [ -z "${SHA:-}" ]; then
            echo "No project id or sha provided; skipping pending status update"
            exit 0
          fi

          if [ -z "$SCM_API_BASE_URL" ] || [ -z "$SCM_API_TOKEN" ]; then
            echo "ΓÜá∩╕Å SCM_API_BASE_URL or SCM_API_TOKEN not configured; skipping status reporting"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          endpoint="${SCM_API_BASE_URL%/}/projects/${PROJECT_ID}/statuses/${SHA}"
          echo "Posting pending status update"
          set +e
          http_code="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS -X POST -H "PRIVATE-TOKEN: ${SCM_API_TOKEN}" "$endpoint" --data-urlencode "state=running" --data-urlencode "target_url=${run_url}" --data-urlencode "description=Deploy in progress" --data-urlencode "name=deploy/proxy" -o /dev/null -w '%{http_code}' 2>&1)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "ΓÜá∩╕Å Pending status update curl failed (exit ${curl_exit}) ΓÇö continuing anyway"
            exit 0
          fi

          if ! printf '%s' "$http_code" | LC_ALL=C grep -Eq '^[0-9]{3}$'; then
            echo "Pending status update returned an invalid HTTP code; continuing anyway"
            exit 0
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ΓÜá∩╕Å Pending status update failed with HTTP ${http_code} ΓÇö continuing anyway"
            exit 0
          fi

          echo "Pending status update accepted (HTTP ${http_code})"

      - name: Select Xcode
        run: |
          set -euo pipefail

          applications_dir="${XCODE_APPLICATIONS_DIR:-/Applications}"
          if [ -n "${XCODE_VERSION:-}" ]; then
            xcode_path="$(find "$applications_dir" -maxdepth 1 -type d -name "Xcode_${XCODE_VERSION}*.app" | LC_ALL=C sort | tail -1)"
          else
            preferred="$(find "$applications_dir" -maxdepth 1 -type d -name 'Xcode_26*.app' | LC_ALL=C sort | tail -1)"
            fallback="$(find "$applications_dir" -maxdepth 1 -type d -name 'Xcode*.app' | LC_ALL=C sort | tail -1)"
            xcode_path="${preferred:-$fallback}"
          fi

          if [ -z "$xcode_path" ]; then
            available_versions="$(find "$applications_dir" -maxdepth 1 -type d -name 'Xcode*.app' -exec basename {} \; \
              | LC_ALL=C sed -nE 's/^Xcode_([0-9]+([.][0-9]+){0,2}).*[.]app$/\1/p' \
              | LC_ALL=C sort -u | paste -sd, -)"
            if [ -n "${XCODE_VERSION:-}" ]; then
              echo "::error::Required Xcode ${XCODE_VERSION} is unavailable on this hosted runner. Available Xcode versions: ${available_versions:-none}. Use a runner image that includes Xcode ${XCODE_VERSION} or update the job xcode_version metadata."
            else
              echo "::error::No Xcode installation was found on this hosted runner."
            fi
            exit 1
          fi

          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcode_details="$(xcodebuild -version)"
          printf '%s\n' "$xcode_details"

          if [ -n "${XCODE_VERSION:-}" ]; then
            selected_xcode_version="$(printf '%s\n' "$xcode_details" | LC_ALL=C awk 'NR == 1 && $1 == "Xcode" { print $2 }')"
            case "$selected_xcode_version" in
              "$XCODE_VERSION"|"$XCODE_VERSION".*) ;;
              *)
                echo "::error::Selected Xcode ${selected_xcode_version:-unknown}, but job metadata requires Xcode ${XCODE_VERSION}."
                exit 1
                ;;
            esac

            required_sdk_major="${XCODE_VERSION%%.*}"
            ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
            case "$ios_sdk_version" in
              "$required_sdk_major"|"$required_sdk_major".*) ;;
              *)
                echo "::error::Selected Xcode ${selected_xcode_version} provides iOS SDK ${ios_sdk_version}, but this job requires the iOS ${required_sdk_major} SDK generation."
                exit 1
                ;;
            esac
            echo "Using iOS SDK ${ios_sdk_version}"
          fi

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: source
        run: |
          set -euo pipefail
          xcodegen generate > /dev/null 2>&1

      # setup-ruby must not see the source checkout: its bundler-cache mode prints
      # the lockfile, the install output and a lockfile-hash cache key to this
      # public log and saves the installed gems as a cache readable from this
      # public repository. Dependencies are installed quietly in the next step.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install bundle dependencies
        working-directory: source
        env:
          BUNDLE_JOBS: '4'
          BUNDLE_RETRY: '3'
        run: |
          set -euo pipefail
          bundle_log="$RUNNER_TEMP/bundle-install.log"
          trap 'rm -f "$bundle_log"' EXIT
          rm -f "$bundle_log"

          # Exit status only: lockfile content is never printed.
          lockfile_sources_are_public() {
            if [ ! -f Gemfile.lock ] || [ -L Gemfile.lock ]; then
              return 1
            fi
            LC_ALL=C awk '
              /^(GIT|PATH|PLUGIN SOURCE)[[:space:]]*$/ { bad = 1 }
              /^[[:space:]]*remote:/ && $0 !~ /^[[:space:]]*remote:[[:space:]]*https:\/\/rubygems\.org\/?[[:space:]]*$/ { bad = 1 }
              END { exit (bad ? 1 : 0) }
            ' Gemfile.lock > /dev/null 2>&1
          }

          require_public_sources() {
            if ! lockfile_sources_are_public; then
              echo "::error::Gemfile.lock must resolve only from https://rubygems.org/ (no git, path, plugin or other remote sources); offending entries are not printed"
              exit 1
            fi
          }

          # Output goes to a runner temp file that is never printed.
          quiet_bundle() {
            local action="$1"
            shift
            local status=0
            bundle "$@" >> "$bundle_log" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::bundle ${action} failed (exit ${status}); output suppressed"
              exit 1
            fi
          }

          quiet_bundle config config set --local path vendor/bundle
          if [ ! -e Gemfile.lock ]; then
            quiet_bundle lock lock
          fi
          require_public_sources
          quiet_bundle install install
          # Install may re-resolve and rewrite the lockfile.
          require_public_sources
          echo "Ruby dependencies installed (output suppressed)"

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_CERTIFICATE_BASE64" ] || [ -z "$SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "Signing certificate secrets are required"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/signing-certificate.p12"

          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path" > /dev/null 2>&1
          security set-keychain-settings -lut 21600 "$keychain_path" > /dev/null 2>&1
          security unlock-keychain -p "$keychain_password" "$keychain_path" > /dev/null 2>&1
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security import "$certificate_path" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path" > /dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" > /dev/null 2>&1
          security list-keychains -d user -s "$keychain_path" login.keychain-db > /dev/null 2>&1

          {
            echo "KEYCHAIN_PATH<<__KEYCHAIN_PATH_EOF__"
            printf '%s' "$keychain_path"
            echo
            echo "__KEYCHAIN_PATH_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "CERTIFICATE_PATH<<__CERTIFICATE_PATH_EOF__"
            printf '%s' "$certificate_path"
            echo
            echo "__CERTIFICATE_PATH_EOF__"
          } >> "$GITHUB_ENV"

      - name: Import provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PROVISIONING_PROFILE_BASE64" ] || [ -z "$BUNDLE_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "PROVISIONING_PROFILE_BASE64, BUNDLE_ID, and TEAM_ID secrets are required"
            exit 1
          fi

          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          profile_plist="$(security cms -D -i "$profile_path" 2>/dev/null)"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$profile_plist")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' /dev/stdin <<< "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' /dev/stdin <<< "$profile_plist")"
          expiration_date="$(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' /dev/stdin <<< "$profile_plist")"

          if [ -z "$profile_uuid" ] || ! printf '%s' "$profile_uuid" | LC_ALL=C grep -Eq '^[0-9A-Fa-f-]{36}$'; then
            echo "Invalid provisioning profile UUID"
            exit 1
          fi

          if [ -z "$profile_name" ] || printf '%s' "$profile_name" | LC_ALL=C grep -q '[^[:print:]]'; then
            echo "Invalid provisioning profile name"
            exit 1
          fi

          if [ "$profile_team_id" != "$TEAM_ID" ]; then
            echo "Provisioning profile team identifier does not match TEAM_ID secret"
            exit 1
          fi

          expected_app_id="${TEAM_ID}.${BUNDLE_ID}"
          if [ "$profile_app_id" != "$expected_app_id" ]; then
            echo "Provisioning profile app identifier does not match BUNDLE_ID secret"
            exit 1
          fi

          if ! /usr/bin/python3 - "$expiration_date" <<'PY'
          import datetime
          import sys
          raw = sys.argv[1]
          value = datetime.datetime.strptime(raw, '%a %b %d %H:%M:%S %Z %Y')
          if value <= datetime.datetime.utcnow():
              raise SystemExit(1)
          PY
          then
            echo "Provisioning profile is expired"
            exit 1
          fi

          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "::add-mask::$profile_uuid"
          echo "::add-mask::$profile_name"
          echo "::add-mask::$profile_app_id"
          echo "::add-mask::$expiration_date"

          {
            echo "PROFILE_PATH<<__PROFILE_PATH_EOF__"
            printf '%s' "$profile_path"
            echo
            echo "__PROFILE_PATH_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "PROFILE_UUID<<__PROFILE_UUID_EOF__"
            printf '%s' "$profile_uuid"
            echo
            echo "__PROFILE_UUID_EOF__"
          } >> "$GITHUB_ENV"
          {
            echo "PROFILE_NAME<<__PROFILE_NAME_EOF__"
            printf '%s' "$profile_name"
            echo
            echo "__PROFILE_NAME_EOF__"
          } >> "$GITHUB_ENV"

      - name: Generate export options plist
        run: |
          set -euo pipefail

          export_options_plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/bin/plutil -create xml1 "$export_options_plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store' "$export_options_plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${TEAM_ID}" "$export_options_plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options_plist"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$export_options_plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options_plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${BUNDLE_ID} string ${PROFILE_NAME}" "$export_options_plist"

          {
            echo "EXPORT_OPTIONS_PLIST<<__EXPORT_OPTIONS_PLIST_EOF__"
            printf '%s' "$export_options_plist"
            echo
            echo "__EXPORT_OPTIONS_PLIST_EOF__"
          } >> "$GITHUB_ENV"

      - name: Create App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: source
        run: |
          set -euo pipefail

          if [ -z "$ASC_KEY_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "App Store Connect secrets are required"
            exit 1
          fi

          key_dir='fastlane/keys'
          key_path="${key_dir}/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          echo "::add-mask::$ASC_KEY_ID"
          echo "::add-mask::$ASC_ISSUER_ID"
          printf '%s' "$ASC_KEY_BASE64" | /usr/bin/base64 -D > "$key_path"

          {
            echo "ASC_KEY_PATH<<__ASC_KEY_PATH_EOF__"
            printf '%s' "$key_path"
            echo
            echo "__ASC_KEY_PATH_EOF__"
          } >> "$GITHUB_ENV"

      - name: Build and upload with Fastlane
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -o pipefail

          if [ -z "$SCHEME_NAME" ]; then
            echo "SCHEME_NAME secret is required"
            exit 1
          fi

          export APP_IDENTIFIER="$BUNDLE_ID"
          export GYM_SCHEME="$SCHEME_NAME"
          export GYM_EXPORT_OPTIONS="$EXPORT_OPTIONS_PLIST"
          export GYM_XCARGS="PROVISIONING_PROFILE_SPECIFIER='${PROFILE_NAME}' CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM='${TEAM_ID}' PRODUCT_BUNDLE_IDENTIFIER='${BUNDLE_ID}'"

          set +e
          bundle exec fastlane beta > deploy.log 2>&1
          fastlane_exit="$?"
          set -e

          if [ "$fastlane_exit" -ne 0 ]; then
            echo "::warning::Fastlane beta exited with code $fastlane_exit; log withheld for privacy"
            if [ -f deploy.log ]; then
              line_count="$(wc -l < deploy.log)"
              echo "deploy.log: ${line_count} lines captured"
            fi
            exit "$fastlane_exit"
          else
            echo "Fastlane beta succeeded"
          fi

      - name: Sanitize deploy log for private status reporting
        id: sanitize_deploy_log
        if: failure() && hashFiles('source/deploy.log') != ''
        # Sanitizing only feeds the private failure-comment excerpt. A sanitizer failure must withhold
        # the excerpt (later steps require outcome == 'success'); raw log text is never published.
        continue-on-error: true
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          temp_log="deploy-sanitizing.tmp"
          final_log="deploy-sanitized.log"
          cleanup() {
            rm -f "$temp_log" "$temp_log.bak"
          }
          trap cleanup EXIT
          rm -f "$temp_log" "$temp_log.bak" "$final_log"
          if [ ! -f deploy.log ]; then
            echo "No deploy.log to sanitize"
            exit 0
          fi
          config_path="$GITHUB_WORKSPACE/.github/sanitize-patterns.json"
          if [ ! -f "$config_path" ]; then
            echo "No sanitizer config; withholding private log details" >&2
            exit 1
          fi
          # Remove terminal formatting before matching diagnostics or sensitive values.
          # LC_ALL=C: macOS BSD sed rejects the [ -/] range under a UTF-8 locale and may reject
          # non-UTF-8 bytes; the C locale makes every regex below operate on raw bytes.
          LC_ALL=C sed -E $'s/\033\\[[0-?]*[ -/]*[@-~]//g' deploy.log > "$temp_log"
          # @tsv doubles regex backslashes; join preserves the JSON-decoded expressions.
          static_patterns="$(jq -r '.static_patterns[] | [.match, .replace] | join("\t")' "$config_path")" || {
            echo "Failed to parse static_patterns from sanitizer config" >&2
            exit 1
          }
          dynamic_env_vars="$(jq -r '.dynamic_env_vars[]?' "$config_path")" || {
            echo "Failed to parse dynamic_env_vars from sanitizer config" >&2
            exit 1
          }
          while IFS=$'\t' read -r match replace; do
            if [ -z "${match:-}" ]; then
              continue
            fi
            match="${match//#/\\#}"
            replace="${replace//#/\\#}"
            LC_ALL=C sed -i.bak -E "s#${match}#${replace}#g" "$temp_log"
          done <<< "$static_patterns"
          while IFS= read -r var_name; do
            if [ -z "${var_name:-}" ]; then
              continue
            fi
            val="${!var_name:-}"
            if [ -z "$val" ]; then
              continue
            fi
            slug="$(printf '%s' "$var_name" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
            while IFS= read -r line || [ -n "$line" ]; do
              printf '%s\n' "${line//"$val"/<${slug}>}"
            done < "$temp_log" > "$temp_log.bak"
            mv "$temp_log.bak" "$temp_log"
          done <<< "$dynamic_env_vars"
          rm -f "$temp_log.bak"
          mv "$temp_log" "$final_log"
          trap - EXIT

      - name: Prepare sanitized deploy log excerpt
        if: failure() && steps.sanitize_deploy_log.outcome == 'success' && hashFiles('source/deploy-sanitized.log') != ''
        # Like sanitizing, the excerpt only feeds the private commit comment and must not affect the
        # job outcome. On failure no excerpt file exists and the comment falls back to a generic notice.
        continue-on-error: true
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          excerpt_file="$RUNNER_TEMP/deploy-log-excerpt.txt"
          rm -f "$excerpt_file" "$excerpt_file.tmp"
          config_path="$GITHUB_WORKSPACE/.github/sanitize-patterns.json"
          if [ ! -f "$config_path" ]; then
            echo "Missing sanitizer config: $config_path" >&2
            exit 1
          fi
          backtick_to_quote="$(jq -r '.post_processing.backtick_to_quote // true' "$config_path")"
          max_lines="$(jq -r '.post_processing.max_lines // 60' "$config_path")"
          max_bytes="$(jq -r '.post_processing.max_bytes // 4096' "$config_path")"
          eof_guard_enabled="$(jq -r '.post_processing.eof_guard // true' "$config_path")"
          eof_guard="__SANITIZED_EOF__"

          apply_post_processing() {
            local input="$1"
            local output="$input"
            if [ "$backtick_to_quote" = 'true' ]; then
              output="$(printf '%s' "$output" | LC_ALL=C tr '`' "'")"
            fi
            if [ "$eof_guard_enabled" = 'true' ]; then
              output="${output//$eof_guard/[REDACTED]}"
            fi
            printf '%s' "$output"
          }

          extracted="$(cat deploy-sanitized.log)"
          if [ -z "$extracted" ]; then
            extracted='The deploy script produced an empty log.'
          fi

          # Reserve the diagnostic and truncation notice before fitting optional context.
          # Applying a prefix byte cutoff afterward could discard the error itself.
          sanitized="$(apply_post_processing "$extracted" | jq -Rrs \
            --argjson max_lines "$max_lines" --argjson max_bytes "$max_bytes" '
            def clip($limit):
              .[0:$limit] | until(utf8bytelength <= $limit; .[0:-1]);
            "--- [truncated; full log withheld for privacy] ---" as $notice
            | split("\n") as $lines
            | if ($lines | length) <= $max_lines and utf8bytelength <= $max_bytes then .
              elif $max_lines < 2 or $max_bytes <= ($notice | utf8bytelength) + 1 then
                error("Excerpt limits must accommodate a diagnostic and truncation notice")
              else
                ([range(0; $lines | length)
                  | select($lines[.] | test("(^|[[:space:]])(fatal )?error:|clang: .*error:|(^|[[:space:]])ld: "; "i")
                      and (test("(^|[[:space:]])ld: warning:"; "i") | not))][0]
                 // [range(0; $lines | length)
                     | select($lines[.] | test("error[: ]|failed|fatal|could not|cannot|loaderror|nomethoderror|nameerror|syntaxerror"; "i"))][0]
                 // (($lines | length) - 1)) as $focus
                | ($lines[$focus] | clip($max_bytes - ($notice | utf8bytelength) - 1)) as $diagnostic
                | (([range([0, ($lines | length) - 30] | max; $lines | length)] | reverse)
                   + [range([0, $focus - 3] | max; [$lines | length, $focus + 26] | min)]) as $candidates
                | reduce $candidates[] as $index (
                    {entries: [{index: $focus, text: $diagnostic}],
                     bytes: (($diagnostic | utf8bytelength) + ($notice | utf8bytelength) + 1)};
                    if all(.entries[]; .index != $index)
                       and (.entries | length) < $max_lines - 1
                       and .bytes + ($lines[$index] | utf8bytelength) + 1 <= $max_bytes then
                      .entries += [{index: $index, text: $lines[$index]}]
                      | .bytes += ($lines[$index] | utf8bytelength) + 1
                    else . end)
                | ([.entries | sort_by(.index)[] | .text] + [$notice] | join("\n"))
              end
          ')"

          # Pass the private excerpt by file: a multi-line GITHUB_ENV value would be re-printed in
          # every later step's env dump, and multi-line masks are not reliable line by line.
          # Write then rename so a partial excerpt is never consumed.
          printf '%s\n' "$sanitized" > "$excerpt_file.tmp"
          mv "$excerpt_file.tmp" "$excerpt_file"

      - name: Extract deploy metadata
        if: always()
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          output_eof_guard="__DEPLOY_ERROR_EOF__"
          excerpt_file="$RUNNER_TEMP/deploy-log-excerpt.txt"
          metadata_file="$RUNNER_TEMP/deploy-metadata.json"

          is_valid_version() {
            case "$1" in ''|*[!0-9.]*) return 1 ;; esac
            printf '%s' "$1" | LC_ALL=C grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'
          }
          is_valid_build_number() {
            case "$1" in ''|*[!0-9]*) return 1 ;; esac
            printf '%s' "$1" | LC_ALL=C grep -Eq '^[0-9]+$'
          }

          build_number=''
          version=''

          # Authoritative source: the Info.plist of the IPA that fastlane exported and uploaded.
          # This lane's fastlane output never prints the new marketing version, and the sanitized
          # log deliberately redacts MARKETING_VERSION / CURRENT_PROJECT_VERSION, so neither log
          # can supply it reliably. The IPA path is never printed.
          shopt -s nullglob
          ipa_files=(./*.ipa)
          shopt -u nullglob
          if [ "${#ipa_files[@]}" -eq 1 ] && [ -f "${ipa_files[0]}" ] && [ ! -L "${ipa_files[0]}" ]; then
            ipa_reader="$RUNNER_TEMP/read-ipa-version.py"
            cat > "$ipa_reader" <<'PY'
          import plistlib
          import re
          import sys
          import zipfile

          try:
              with zipfile.ZipFile(sys.argv[1]) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)
                  ]
                  if len(names) != 1:
                      raise SystemExit(0)
                  info = plistlib.loads(archive.read(names[0]))
          except Exception:
              raise SystemExit(0)


          def field(key):
              value = info.get(key) if isinstance(info, dict) else None
              if isinstance(value, str) and value.isascii() and value.isprintable():
                  return value
              return ""


          print(field("CFBundleShortVersionString"))
          print(field("CFBundleVersion"))
          PY
            ipa_metadata="$(/usr/bin/python3 "$ipa_reader" "${ipa_files[0]}" 2>/dev/null)" || ipa_metadata=''
            rm -f "$ipa_reader"
            candidate_version="$(printf '%s\n' "$ipa_metadata" | sed -n '1p')"
            candidate_build_number="$(printf '%s\n' "$ipa_metadata" | sed -n '2p')"
            if is_valid_version "$candidate_version"; then version="$candidate_version"; fi
            if is_valid_build_number "$candidate_build_number"; then build_number="$candidate_build_number"; fi
          fi

          # Fallback for the build number only: fastlane's increment_build_number echoes its exact
          # command ("$ cd <dir> && agvtool new-version -all <N> && cd -"). The anchored pattern can
          # capture digits only; nothing else from the raw log is read.
          if [ -z "$build_number" ] && [ -f deploy.log ]; then
            candidate_build_number="$(LC_ALL=C sed -E $'s/\033\\[[0-?]*[ -/]*[@-~]//g' deploy.log \
              | LC_ALL=C sed -nE 's/^.*\$ cd .* && agvtool new-version( -all)?[[:space:]]+([0-9]+) && cd -[[:space:]]*$/\2/p' \
              | tail -1)" || candidate_build_number=''
            if is_valid_build_number "$candidate_build_number"; then build_number="$candidate_build_number"; fi
          fi

          if [ -z "$build_number" ]; then build_number='unknown'; fi
          if [ -z "$version" ]; then version='unknown'; fi

          deploy_error=''
          if [ -f deploy-sanitized.log ]; then
            # fastlane's own failure summary (its last "[!] ..." line) is the most specific headline.
            deploy_error="$(LC_ALL=C grep -E '^\[!\]' deploy-sanitized.log | tail -1 || true)"
            if [ -z "$deploy_error" ]; then
              # Anchor "ld:" so routine lines such as "... is build: 41" are not taken for linker errors,
              # and skip linker warnings, which most Swift package builds print.
              deploy_error="$(LC_ALL=C grep -iE '((^|[[:space:]])(fatal )?error:|clang: .*error:|(^|[[:space:]])ld: )' deploy-sanitized.log \
                | LC_ALL=C grep -viE '(^|[[:space:]])ld: warning:' | head -1 || true)"
            fi
            if [ -z "$deploy_error" ]; then
              deploy_error="$(LC_ALL=C grep -E '\*\* (BUILD|ARCHIVE) FAILED \*\*' deploy-sanitized.log | head -1 || true)"
            fi
            if [ -z "$deploy_error" ]; then
              deploy_error="$(LC_ALL=C grep -iE 'LoadError|NoMethodError|NameError|SyntaxError|cannot load|undefined method' deploy-sanitized.log | LC_ALL=C grep -v '^\s*$' | head -1 || true)"
            fi
            if [ -z "$deploy_error" ]; then
              deploy_error="$(LC_ALL=C grep -iE 'error|fatal|failed|Could not|cannot|No available|Unauthorized|forbidden|timed out|refused|Invalid|not found|Connection|App Store Connect|authentication' deploy-sanitized.log | LC_ALL=C grep -v '^\s*$' | tail -1 || true)"
            fi
            if [ -z "$deploy_error" ]; then
              deploy_error="$(head -3 deploy-sanitized.log | tail -1 || true)"
            fi

            # jq cuts by character and replaces invalid UTF-8 with U+FFFD; a byte-wise cut could
            # split a character and GitLab rejects invalid UTF-8 in the status description.
            deploy_error="$(printf '%s' "$deploy_error" | LC_ALL=C tr '\n`' " '" | LC_ALL=C sed -E 's/[[:space:]]+/ /g' | jq -Rrs '.[0:200]')"
          elif [ -f "$excerpt_file" ] && [ ! -L "$excerpt_file" ] && [ -s "$excerpt_file" ]; then
            deploy_error="$(LC_ALL=C tr '\n' ' ' < "$excerpt_file" | LC_ALL=C sed -E 's/[[:space:]]+/ /g' | jq -Rrs '.[0:200]')"
          fi

          deploy_error="${deploy_error//$output_eof_guard/[REDACTED]}"
          if [ -n "$deploy_error" ]; then
            # No quotes in the replacement: macOS /bin/bash 3.2 would keep them literally.
            # The whitespace squeeze above already removed CR and LF.
            percent_escape='%25'
            masked_error="${deploy_error//[%]/$percent_escape}"
            echo "::add-mask::$masked_error"
          fi

          # Build number and marketing version are public, low-entropy release metadata.
          # Do not register them as masks or export them through GITHUB_ENV: masks corrupt
          # unrelated public output, while step environment headers can disclose env values.
          # JSON preserves the values as data, and the runner-private file is replaced atomically.
          metadata_temp=''
          cleanup_metadata_temp() {
            if [ -n "$metadata_temp" ]; then rm -f "$metadata_temp"; fi
          }
          trap cleanup_metadata_temp EXIT
          umask 077
          metadata_temp="$(mktemp "$RUNNER_TEMP/deploy-metadata.XXXXXX")"
          chmod 600 "$metadata_temp"
          jq -n \
            --arg version "$version" \
            --arg build_number "$build_number" \
            '{version: $version, build_number: $build_number}' > "$metadata_temp"
          rm -f "$metadata_file"
          mv "$metadata_temp" "$metadata_file"
          metadata_temp=''
          trap - EXIT

          {
            echo "DEPLOY_ERROR<<__DEPLOY_ERROR_EOF__"
            printf '%s' "$deploy_error"
            echo
            echo "__DEPLOY_ERROR_EOF__"
          } >> "$GITHUB_ENV"

      - name: Report success status
        if: success()
        env:
          SCM_API_BASE_URL: ${{ secrets.SCM_API_BASE_URL }}
          SCM_API_TOKEN: ${{ secrets.SCM_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PROJECT_ID" ] || [ -z "${SHA:-}" ]; then
            echo "No project id or sha provided; skipping success status update"
            exit 0
          fi

          if [ -z "$SCM_API_BASE_URL" ] || [ -z "$SCM_API_TOKEN" ]; then
            echo "ΓÜá∩╕Å SCM_API_BASE_URL or SCM_API_TOKEN not configured; skipping status reporting"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          endpoint="${SCM_API_BASE_URL%/}/projects/${PROJECT_ID}/statuses/${SHA}"
          metadata_file="$RUNNER_TEMP/deploy-metadata.json"
          version='unknown'
          build_number='unknown'
          if [ -f "$metadata_file" ] && [ ! -L "$metadata_file" ]; then
            candidate_version="$(jq -er '.version | select(type == "string")' "$metadata_file" 2>/dev/null)" || candidate_version=''
            candidate_build_number="$(jq -er '.build_number | select(type == "string")' "$metadata_file" 2>/dev/null)" || candidate_build_number=''
            case "$candidate_version" in
              ''|*[!0-9.]*) ;;
              *) if printf '%s' "$candidate_version" | LC_ALL=C grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then version="$candidate_version"; fi ;;
            esac
            case "$candidate_build_number" in
              ''|*[!0-9]*) ;;
              *) build_number="$candidate_build_number" ;;
            esac
          fi
          description="Deploy succeeded - v${version} (${build_number})"
          echo "Posting success status update"
          set +e
          http_code="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS -X POST -H "PRIVATE-TOKEN: ${SCM_API_TOKEN}" "$endpoint" --data-urlencode "state=success" --data-urlencode "target_url=${run_url}" --data-urlencode "description=${description}" --data-urlencode "name=deploy/proxy" -o /dev/null -w '%{http_code}' 2>&1)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "ΓÜá∩╕Å Success status update curl failed (exit ${curl_exit}) ΓÇö continuing anyway"
            exit 0
          fi

          if ! printf '%s' "$http_code" | LC_ALL=C grep -Eq '^[0-9]{3}$'; then
            echo "Success status update returned an invalid HTTP code; continuing anyway"
            exit 0
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ΓÜá∩╕Å Success status update failed with HTTP ${http_code} ΓÇö continuing anyway"
            exit 0
          fi

          echo "Success status update accepted (HTTP ${http_code})"

      - name: Report failure status
        if: failure()
        env:
          SCM_API_BASE_URL: ${{ secrets.SCM_API_BASE_URL }}
          SCM_API_TOKEN: ${{ secrets.SCM_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_ID:-}" ] || [ -z "${SHA:-}" ]; then
            echo "No project id or sha provided; skipping failure status update"
            exit 0
          fi

          if [ -z "$SCM_API_BASE_URL" ] || [ -z "$SCM_API_TOKEN" ]; then
            echo "ΓÜá∩╕Å SCM_API_BASE_URL or SCM_API_TOKEN not configured; skipping status reporting"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          endpoint="${SCM_API_BASE_URL%/}/projects/${PROJECT_ID}/statuses/${SHA}"
          description="Deploy failed"
          if [ -n "${DEPLOY_ERROR:-}" ]; then
            description="Deploy failed - ${DEPLOY_ERROR:0:80}"
          fi
          echo "Posting failure status update"
          set +e
          http_code="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS -X POST -H "PRIVATE-TOKEN: ${SCM_API_TOKEN}" "$endpoint" --data-urlencode "state=failed" --data-urlencode "target_url=${run_url}" --data-urlencode "description=${description}" --data-urlencode "name=deploy/proxy" -o /dev/null -w '%{http_code}' 2>&1)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "ΓÜá∩╕Å Failure status update curl failed (exit ${curl_exit}) ΓÇö continuing anyway"
            exit 0
          fi

          if ! printf '%s' "$http_code" | LC_ALL=C grep -Eq '^[0-9]{3}$'; then
            echo "Failure status update returned an invalid HTTP code; continuing anyway"
            exit 0
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ΓÜá∩╕Å Failure status update failed with HTTP ${http_code} ΓÇö continuing anyway"
            exit 0
          fi

          echo "Failure status update accepted (HTTP ${http_code})"

      - name: Comment on source commit
        if: always()
        env:
          SCM_API_BASE_URL: ${{ secrets.SCM_API_BASE_URL }}
          SCM_API_TOKEN: ${{ secrets.SCM_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_ID:-}" ] || [ -z "${SHA:-}" ]; then
            echo "No project id or sha provided; skipping commit comment"
            exit 0
          fi

          if [ -z "$SCM_API_BASE_URL" ] || [ -z "$SCM_API_TOKEN" ]; then
            echo "ΓÜá∩╕Å SCM_API_BASE_URL or SCM_API_TOKEN not configured; skipping status reporting"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = 'success' ]; then
            metadata_file="$RUNNER_TEMP/deploy-metadata.json"
            version='unknown'
            build_number='unknown'
            if [ -f "$metadata_file" ] && [ ! -L "$metadata_file" ]; then
              candidate_version="$(jq -er '.version | select(type == "string")' "$metadata_file" 2>/dev/null)" || candidate_version=''
              candidate_build_number="$(jq -er '.build_number | select(type == "string")' "$metadata_file" 2>/dev/null)" || candidate_build_number=''
              case "$candidate_version" in
                ''|*[!0-9.]*) ;;
                *) if printf '%s' "$candidate_version" | LC_ALL=C grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then version="$candidate_version"; fi ;;
              esac
              case "$candidate_build_number" in
                ''|*[!0-9]*) ;;
                *) build_number="$candidate_build_number" ;;
              esac
            fi
            body="$(printf 'Deploy succeeded - v%s (%s)\n\n[View run](%s)' \
              "$version" "$build_number" "$run_url")"
          else
            # The excerpt arrives by file, never via GITHUB_ENV; read it only if it is a regular, non-empty file.
            log_excerpt='Sanitized deploy log unavailable; the deploy script may not have run or log sanitization failed.'
            excerpt_file="$RUNNER_TEMP/deploy-log-excerpt.txt"
            if [ -f "$excerpt_file" ] && [ ! -L "$excerpt_file" ] && [ -s "$excerpt_file" ]; then
              log_excerpt="$(cat "$excerpt_file")"
            fi
            body="$(printf 'Deploy to TestFlight failed\n\nError: %s\n\n[View run](%s)\n\n<details><summary>Sanitized deploy log excerpt</summary>\n\n```text\n%s\n```\n\n</details>' \
              "${DEPLOY_ERROR:-No error details captured}" "$run_url" "$log_excerpt")"
          fi

          endpoint="${SCM_API_BASE_URL%/}/projects/${PROJECT_ID}/repository/commits/${SHA}/comments"
          echo "Posting commit comment"
          set +e
          http_code="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 -sS -X POST -H "PRIVATE-TOKEN: ${SCM_API_TOKEN}" "$endpoint" --data-urlencode "note=${body}" -o /dev/null -w '%{http_code}' 2>&1)"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "ΓÜá∩╕Å Commit comment curl failed (exit ${curl_exit}) ΓÇö continuing anyway"
            exit 0
          fi

          if ! printf '%s' "$http_code" | LC_ALL=C grep -Eq '^[0-9]{3}$'; then
            echo "Commit comment returned an invalid HTTP code; continuing anyway"
            exit 0
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ΓÜá∩╕Å Commit comment failed with HTTP ${http_code} ΓÇö continuing anyway"
            exit 0
          fi

          echo "Commit comment accepted (HTTP ${http_code})"

      - name: Clean up
        if: always()
        run: |
          rm -f "${ASC_KEY_PATH:-}"
          rm -f "${CERTIFICATE_PATH:-}"
          rm -f "${PROFILE_PATH:-}"
          rm -f "${EXPORT_OPTIONS_PLIST:-}"
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -f "$RUNNER_TEMP/deploy-metadata.json" "$RUNNER_TEMP"/deploy-metadata.?????? "$RUNNER_TEMP/deploy-log-excerpt.txt" "$RUNNER_TEMP/deploy-log-excerpt.txt.tmp" "$RUNNER_TEMP/read-ipa-version.py" "$RUNNER_TEMP/bundle-install.log" "$RUNNER_TEMP/state-response.json"
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -rf source